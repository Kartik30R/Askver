version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: deal_intelligence_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: deal_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deal_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deal_intelligence_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@db:5432/deal_db
      - API_V1_STR=/api/v1
      - PROJECT_NAME=Deal Intelligence Assistant
      - JWT_SECRET_KEY=your_development_jwt_secret_key_change_in_prod
      - JWT_REFRESH_SECRET_KEY=your_development_refresh_secret_key_change_in_prod
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - UPLOAD_DIR=/tmp/uploads
    volumes:
      - ./storage:/app/storage
      - ./app:/app/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: